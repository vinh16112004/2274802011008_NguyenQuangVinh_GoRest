name: Automated API Testing with Newman

on:
  push:
  pull_request:
  workflow_dispatch: # Cho phép bấm nút Run workflow thủ công trên tab Actions

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman Collection via Newman
        run: |
          newman run 2274802011008_NguyenQuangVinh_GoRest.postman_collection.json \
            -e 2274802011008_NguyenQuangVinh_GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: newman-report.html

name: GoRest API CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Cài đặt Newman CLI
        run: npm install -g newman

      - name: 4. Chạy bộ Test tự động với Data-Driven (users.csv)
        run: |
          newman run 2274802011008_NguyenQuangVinh_GoRest.postman_collection.json -e 2274802011008_NguyenQuangVinh_GoRest_Env.postman_environment.json -d users.csv --env-var "token=${{ secrets.GOREST_TOKEN }}"
